# the ID and the package name stay from when the app was called Encore, so installed copies
# update in place and keep their taskbar pins; the install folder stays %LOCALAPPDATA%\Programs\encore
appId: app.encore.player
productName: Vyse Music
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
npmRebuild: false
win:
  target:
    - nsis
  icon: build/icon.png
  # the program file keeps its old name: an update that renames it would break taskbar pins.
  # Windows still shows Vyse Music everywhere, since the file's description is the product name.
  executableName: Encore
# one click installs for the current user, with no admin prompt, and opens Vyse Music;
# that also lets updates go in silently
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Vyse Music
  uninstallDisplayName: Vyse Music
  artifactName: Vyse-Music-Setup-${version}.${ext}
# where installed copies look for new versions (see "Release a new version" in the README)
publish:
  provider: github
  owner: Sameer786op
  repo: encore
  releaseType: release
